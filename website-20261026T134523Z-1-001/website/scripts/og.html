<!doctype html>
<!-- Social preview card. Rendered to og-image.png (1200x630) by scripts/build-og.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 400 700; src: url(../assets/fonts/inter-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600 800; src: url(../assets/fonts/jakarta-latin.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Inter', sans-serif; color: #fff;
    background:
      radial-gradient(70% 90% at 92% 105%, rgba(42, 53, 251, 0.55), transparent 60%),
      radial-gradient(40% 50% at 10% 0%, rgba(90, 61, 255, 0.25), transparent 70%),
      #05071a;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 16px);
  }
  .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 800 34px/1 'Plus Jakarta Sans'; letter-spacing: -0.03em; }
  .brand img { width: 52px; height: 49px; }
  .sis { padding: 6px 10px 5px; border-radius: 9px; background: linear-gradient(135deg, #2a35fb, #5a3dff); font-size: 22px; letter-spacing: 0.08em; }
  h1 { margin-top: 64px; font: 800 66px/1.02 'Plus Jakarta Sans'; letter-spacing: -0.04em; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.4; color: #b9bdf0; }
  .live { display: inline-flex; align-items: center; gap: 10px; margin-top: 34px; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); font-size: 19px; color: #e8eaff; }
  .live i { width: 11px; height: 11px; border-radius: 50%; background: #c9f158; }
  .shot {
    position: absolute; left: 690px; top: 92px; width: 900px;
    border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
    transform: perspective(1600px) rotateY(-14deg) rotateX(4deg); transform-origin: 0 50%;
  }
  .shot img { display: block; width: 100%; }
  .card {
    position: absolute; left: 640px; top: 360px; width: 330px; padding: 18px 20px;
    border-radius: 16px; background: #fff; color: #0d1033; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
  }
  .card b { display: block; font: 700 20px/1.2 'Plus Jakarta Sans'; }
  .card span { display: block; margin-top: 6px; font-size: 16px; color: #5d6388; }
  .card .t { position: absolute; right: 16px; top: 16px; padding: 6px 10px; border-radius: 999px; background: #12804a; color: #fff; font: 600 15px 'Inter'; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../assets/img/mark-128.png" alt=""> Neeti <span class="sis">SIS</span></div>
    <h1>The lead CRM that reaches every buyer first.</h1>
    <p>Lead capture, WhatsApp automation and AI call analysis for real estate sales teams in India.</p>
    <div class="live"><i></i>15-day free trial, no card needed</div>
  </div>
  <div class="shot"><img src="../assets/img/dashboard-1600.webp" alt=""></div>
  <div class="card"><span class="t">07:31</span><b>Site visit booked</b><span>Priya Sharma, 3 BHK, Saturday 11 AM</span></div>
</body>
</html>
