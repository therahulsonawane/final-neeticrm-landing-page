# neetisis.com on Netlify. The site is plain files: no build step.
# Keep the existing /sales_hiring/ folder next to index.html when deploying.

[build]
  publish = "."

# Fonts never change under the same name.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images, CSS and JS keep their names when edited, so browsers keep them for a day and then
# re-check (Netlify answers 304 when nothing changed). The paths do not overlap on purpose:
# Netlify combines headers from every rule that matches a file.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
